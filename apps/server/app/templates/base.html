<!DOCTYPE html>
<html lang="en" class="bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Switchboard{% endblock %} · Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
</head>
<body class="min-h-screen text-slate-800">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard" class="font-semibold text-lg">Switchboard</a>
      <div class="flex gap-4 text-sm">
        <a href="/dashboard" class="hover:text-blue-600">Overview</a>
        <a href="/dashboard/playground" class="hover:text-blue-600">Playground</a>
        <a href="/dashboard/requests" class="hover:text-blue-600">Requests</a>
        <a href="/dashboard/cost" class="hover:text-blue-600">Cost</a>
        <a href="/docs" class="text-slate-500 hover:text-blue-600">API Docs</a>
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-6xl mx-auto px-4 py-6 text-xs text-slate-400">
    Refresh to update. Data from <code>data/router.db</code>.
  </footer>
</body>
</html>
