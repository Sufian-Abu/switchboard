[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Cost-aware LLM router with built-in observability — drop-in OpenAI-compatible endpoint that routes by task type and price."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Switchboard contributors" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "PyYAML==6.0.2",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "SQLAlchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "Jinja2==3.1.4",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.0",
    "black==24.10.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]

# We intentionally do NOT auto-discover packages here. The repo uses a
# multi-root layout (`apps/server/app` + `packages/router`) that does not
# match the standard "src/" or flat conventions, so we rely on PYTHONPATH /
# conftest.py for imports. Install with `pip install -e .` for editable
# dependency management; the test suite resolves packages via `conftest.py`.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]
